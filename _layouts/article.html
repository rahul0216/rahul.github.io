---
layout: default
---

<div class="page-shell">
  {% include header.html %}

  <main id="main-content">
    <article class="article-page">
      <header class="article-header">
        <a class="back-link" href="{{ '/#research' | relative_url }}">&larr; All research</a>
        <p class="article-byline">
          <time datetime="{{ page['ms.date'] }}">{{ page['ms.date'] | date: "%d %B %Y" }}</time>
          <span aria-hidden="true">&middot;</span>
          {{ page.estimated_reading_time }} min read
        </p>
        <h1>{{ page.title }}</h1>
        <p class="article-description">{{ page.description }}</p>
      </header>

      <div class="article-content">
        {{ content }}
      </div>
    </article>
  </main>

  {% include footer.html %}
</div>

<script type="module" src="{{ '/assets/js/mermaid-embeds.js' | relative_url }}"></script>
